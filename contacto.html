  <!-- BARRA LATERAL DESPLEGABLE (DRAWER) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar-drawer" id="sidebar-drawer">

      <span style="font-weight: 800; font-size: 1.2rem;">Menú Principal</span>

    <ul class="sidebar-menu">
      <li><a href="admin.html"><span>Inicio</span> <span>➔</span></a></li>

    <!-- Sección de Contacto -->
    <section class="seccion-tulipan-contacto" style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px;">
        <div class="tulipan-contacto-card">
            <h2 class="tulipan-titulo">🌷 Propósito & Contacto</h2>
            <p class="tulipan-subtitulo">¿Tienes dudas sobre sustratos, plagas o cultivos? Escríbenos y conéctate con nosotros.</p>
            
            <form id="form-contacto" onsubmit="enviarMensajeBackend(event)" class="tulipan-form">
                <div class="tulipan-form-group">
                    <label for="contacto-nombre">Tu Nombre</label>
                    <input type="text" id="contacto-nombre" placeholder="Ej. Fabrizzio" required>
                </div>
                
                <div class="tulipan-form-group">
                    <label for="contacto-email">Correo Electrónico</label>
                    <input type="email" id="contacto-email" placeholder="tucorreo@email.com" required>
                </div>
                
                <div class="tulipan-form-group">
                    <label for="contacto-mensaje">Mensaje</label>
                    <textarea id="contacto-mensaje" rows="4" placeholder="Escribe tu consulta botánica..." required></textarea>
                </div>
                
                <button type="submit" id="btn-enviar-contacto" class="btn-tulipan-enviar">
                    Enviar Mensaje
                </button>
            </form>
            <div style="text-align: center; margin-top: 20px;">
    <a href="index.html" style="color: #aaa; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color='#f48fb1'" onmouseout="this.style.color='#aaa'">
        
    </a>
</div>
        </div>
    </section>

    <script>
    async function enviarMensajeBackend(event) {
        event.preventDefault();

        const nombre = document.getElementById('contacto-nombre').value;
        const email = document.getElementById('contacto-email').value;
        const mensaje = document.getElementById('contacto-mensaje').value;
        const btn = document.getElementById('btn-enviar-contacto');

        btn.textContent = "Enviando...";
        btn.disabled = true;

        try {
            // URL BACKEND 
            const response = await fetch('https://green-worms-backend.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, mensaje })
            });

            const resultado = await response.json();

            if (response.ok) {
                alert('¡Mensaje enviado con éxito! Gracias por contactar a Green Worms.');
                document.getElementById('form-contacto').reset();
            } else {
                alert('Error: ' + resultado.error);
            }
        } catch (error) {
            console.error('Error de red:', error);
            alert('No se pudo conectar con el servidor.');
        } finally {
            btn.textContent = "Enviar Mensaje";
            btn.disabled = false;
        }
    }
</script>

    <!-- Carga la barra de navegación global de Green Worms -->
    <script src="js/navbar.js"></script>
